<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aangan Studio — Enquiry Dashboard</title>
<style>
  :root {
    color-scheme: dark;
    --page: #050505;
    --surface: #0d0d0d;
    --surface-raised: #131313;
    --text-primary: #f7f7f5;
    --text-secondary: #a7a6a0;
    --text-muted: #6e6d68;
    --gridline: #232321;
    --baseline: #343431;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.18);
    --series-1: #3987e5;
    --series-1-soft: #132543;
    --good: #0ca30c;
    --good-soft: #10281a;
    --warning: #fab219;
    --warning-soft: #332813;
    --critical: #e66767;
    --critical-soft: #3a1a1a;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 28px rgba(0,0,0,0.35);
    --glow: rgba(57,135,229,0.28);
    --ticker-bg: #000000;
    --ticker-fg: #f7f7f5;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --page: #f9f9f7;
      --surface: #fcfcfb;
      --surface-raised: #ffffff;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --text-muted: #898781;
      --gridline: #e1e0d9;
      --baseline: #c3c2b7;
      --border: rgba(11,11,11,0.10);
      --border-strong: rgba(11,11,11,0.16);
      --series-1: #2a78d6;
      --series-1-soft: #cde2fb;
      --good: #0ca30c;
      --good-soft: #e3f6e3;
      --warning: #c98500;
      --warning-soft: #fdf1da;
      --critical: #d03b3b;
      --critical-soft: #fbe6e6;
      --shadow: 0 1px 2px rgba(11,11,11,0.04), 0 4px 16px rgba(11,11,11,0.04);
      --glow: rgba(42,120,214,0.18);
      --ticker-bg: #0b0b0b;
      --ticker-fg: #f9f9f7;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--page); }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px 80px; position: relative; }

  /* Ticker — clevante-style marquee strip */
  .ticker {
    background: var(--ticker-bg);
    color: var(--ticker-fg);
    overflow: hidden;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }
  .ticker-track {
    display: inline-flex;
    align-items: center;
    animation: ticker-scroll 28s linear infinite;
    will-change: transform;
  }
  .ticker:hover .ticker-track { animation-play-state: paused; }
  .ticker-item {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 10px 24px; flex-shrink: 0;
  }
  .ticker-item .dot-sep { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: 0.45; }
  .ticker-item .num { font-variant-numeric: tabular-nums; color: var(--series-1); }
  @keyframes ticker-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ticker-track { animation: none; }
  }

  /* Top bar — small wordmark + status, like clevante's nav row */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 0; border-bottom: 1px solid var(--border);
    margin-bottom: 56px;
  }
  .wordmark {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase;
  }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--series-1), #1c5cab);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 13px; flex-shrink: 0;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .wordmark:hover .brand-mark { transform: rotate(-6deg) scale(1.08); box-shadow: 0 4px 18px var(--glow); }
  .live-dot {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--text-secondary); font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    border: 1px solid var(--border-strong); border-radius: 100px; padding: 7px 14px 7px 10px;
  }
  .live-dot .pulse {
    width: 6px; height: 6px; border-radius: 50%; background: var(--good);
    box-shadow: 0 0 0 0 rgba(12,163,12,0.5);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(12,163,12,0.45); }
    70% { box-shadow: 0 0 0 6px rgba(12,163,12,0); }
    100% { box-shadow: 0 0 0 0 rgba(12,163,12,0); }
  }

  /* Hero headline block */
  .hero { position: relative; padding-bottom: 36px; margin-bottom: 8px; overflow: hidden; }
  .hero::before {
    content: '';
    position: absolute; top: -220px; right: -160px; width: 520px; height: 520px;
    background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero h1 {
    font-size: clamp(34px, 6.4vw, 64px);
    line-height: 0.98;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    margin: 0 0 18px;
    position: relative;
  }
  .hero h1 em {
    font-style: normal; color: var(--text-muted);
  }
  .hero .meta-row {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .hero .subtitle { color: var(--text-secondary); font-size: 14.5px; max-width: 460px; }
  .hero .updated { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  /* Numbered stat row — editorial list, like clevante's 01/02/03 services */
  .stat-row { border-top: 1px solid var(--border); margin-bottom: 56px; }
  .stat-item {
    display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 18px;
    padding: 22px 0; border-bottom: 1px solid var(--border);
    transition: padding-left 0.25s ease, border-color 0.2s ease;
    position: relative;
  }
  .stat-item::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: var(--stat-accent, var(--series-1));
    transform: scaleY(0); transform-origin: top; transition: transform 0.3s ease;
  }
  .stat-item:hover { padding-left: 14px; border-color: var(--border-strong); }
  .stat-item:hover::before { transform: scaleY(1); }
  .stat-index { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; font-weight: 700; }
  .stat-label { font-size: 13px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .stat-sub { color: var(--text-muted); font-size: 12px; margin-top: 4px; text-transform: none; letter-spacing: 0; }
  .stat-value { font-size: clamp(26px, 4vw, 40px); font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: proportional-nums; text-align: right; white-space: nowrap; }

  .section-head {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px;
  }
  .section-head .idx { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; font-weight: 700; }
  .section-head h2 {
    font-size: 13px; margin: 0; color: var(--text-primary); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    display: inline-block; position: relative; padding-bottom: 2px;
  }
  .section-head h2::after {
    content: ''; position: absolute; left: 0; bottom: -2px; height: 1px; width: 100%;
    background: var(--series-1); transform: scaleX(0); transform-origin: left;
    transition: transform 0.3s ease;
  }
  .card:hover .section-head h2::after { transform: scaleX(1); }

  .grid-2 {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 1px;
    margin-bottom: 1px;
    background: var(--border);
  }
  @media (max-width: 760px) {
    .grid-2 { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 26px;
    margin-bottom: -1px;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .card:hover { border-color: var(--border-strong); background: var(--surface-raised); }
  .card .card-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 22px; }

  /* Bar chart */
  .chart { display: flex; align-items: flex-end; gap: 5px; height: 150px; position: relative; }
  .chart::before {
    content: ''; position: absolute; left: 0; right: 0; bottom: 24px;
    border-bottom: 1px solid var(--gridline);
  }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
  .bar-wrap { position: relative; width: 100%; display: flex; justify-content: center; height: 100%; align-items: flex-end; }
  .bar {
    width: 100%; max-width: 24px; background: var(--series-1);
    border-radius: 2px 2px 0 0; min-height: 2px;
    transition: opacity 0.15s, transform 0.15s, box-shadow 0.15s;
    cursor: default;
    transform-origin: bottom;
  }
  .bar:hover { opacity: 0.9; transform: scaleY(1.02) scaleX(1.08); box-shadow: 0 0 14px var(--glow); }
  .bar.zero { background: var(--gridline); }
  .bar-label { color: var(--text-muted); font-size: 10px; margin-top: 6px; white-space: nowrap; }
  .bar-tooltip {
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%) translateY(2px);
    background: var(--text-primary); color: var(--page);
    font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 3px;
    white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.15s, transform 0.15s;
    z-index: 2;
  }
  .bar-col:hover .bar-tooltip { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Status breakdown — numbered rows */
  .breakdown { display: flex; flex-direction: column; }
  .breakdown-row {
    display: grid; grid-template-columns: 22px 92px 1fr auto; align-items: center; gap: 10px;
    padding: 12px 0; border-top: 1px solid var(--gridline);
  }
  .breakdown-row:first-child { border-top: none; }
  .breakdown-idx { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .breakdown-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .breakdown-track { height: 3px; border-radius: 0; background: var(--gridline); overflow: hidden; }
  .breakdown-fill { height: 100%; width: 0; transition: width 0.6s cubic-bezier(.22,.61,.36,1); }
  .breakdown-count { font-size: 14px; font-weight: 700; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--text-muted); font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; padding: 0 10px 12px; border-bottom: 1px solid var(--border-strong); }
  td { padding: 13px 10px; border-bottom: 1px solid var(--gridline); color: var(--text-primary); font-variant-numeric: tabular-nums; }
  tbody tr { transition: background 0.15s; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tr:last-child td { border-bottom: none; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em;
    padding: 4px 10px 4px 8px; border-radius: 100px; border: 1px solid currentColor;
    transition: transform 0.15s ease;
  }
  tbody tr:hover .status-pill { transform: scale(1.04); }
  .status-pill.good { color: var(--good); }
  .status-pill.warning { color: var(--warning); }
  .status-pill.critical { color: var(--critical); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .table-scroll { overflow-x: auto; }
  table { min-width: 560px; }

  .note {
    color: var(--text-muted); font-size: 12px; line-height: 1.7;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .note .icon { flex-shrink: 0; margin-top: 1px; color: var(--series-1); }
  .empty { color: var(--text-muted); font-size: 13px; padding: 28px 0; text-align: center; }
  .error {
    color: var(--critical); font-size: 13px; background: var(--critical-soft);
    border-radius: 4px; padding: 16px; display: flex; gap: 10px; align-items: flex-start;
  }
  .skeleton {
    background: linear-gradient(90deg, var(--border) 25%, var(--border-strong) 37%, var(--border) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  .skeleton-rows { display: flex; flex-direction: column; gap: 1px; margin-bottom: 56px; }
  .skeleton-row { height: 68px; }
</style>
</head>
<body>
<div class="ticker" id="ticker" aria-hidden="true">
  <div class="ticker-track" id="ticker-track"></div>
</div>
<div class="wrap">
  <div class="topbar">
    <div class="wordmark">
      <div class="brand-mark">A</div>
      AANGAN STUDIO
    </div>
    <div class="live-dot"><span class="pulse"></span> Live · Supabase</div>
  </div>

  <div class="hero">
    <h1>Phone enquiry<br><em>/</em> dashboard</h1>
    <div class="meta-row">
      <div class="subtitle">Call intelligence for aangan-phone-enquiry-agent — qualification, bookings and pipeline, straight from the voice agent.</div>
      <div class="updated" id="generated-at"></div>
    </div>
  </div>

  <div id="content">
    <div class="skeleton-rows">
      <div class="skeleton skeleton-row"></div>
      <div class="skeleton skeleton-row"></div>
      <div class="skeleton skeleton-row"></div>
      <div class="skeleton skeleton-row"></div>
    </div>
  </div>
</div>

<script>
const REFRESH_MS = 30000;

async function load(isBackground) {
  const content = document.getElementById('content');
  try {
    const res = await fetch('/api/metrics');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load metrics');
    render(data);
  } catch (err) {
    if (!isBackground) {
      content.innerHTML = '<div class="card"><div class="error">' +
        '<svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.3"/><path d="M8 4.5v4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="11" r="0.8" fill="currentColor"/></svg>' +
        '<span>Could not load dashboard data: ' + escapeHtml(err.message) + '</span>' +
        '</div></div>';
    }
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function inr(n) {
  return '₹' + Math.round(n).toLocaleString('en-IN');
}

function statusMeta(status) {
  if (status === 'Qualified') return { cls: 'good', color: 'var(--good)' };
  if (status === 'Needs Review') return { cls: 'warning', color: 'var(--warning)' };
  if (status === 'Declined') return { cls: 'critical', color: 'var(--critical)' };
  return { cls: 'warning', color: 'var(--warning)' };
}

// Micro-interaction: animate a number from its previous value up to the new one.
function animateValue(el, from, to, isCurrency) {
  const duration = 650;
  const start = performance.now();
  function step(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    const current = from + (to - from) * eased;
    el.textContent = isCurrency ? inr(current) : Math.round(current).toLocaleString('en-IN');
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function buildTicker(data) {
  const items = [
    { label: 'Total enquiries', value: data.totalCalls },
    { label: 'Qualified leads', value: data.qualifiedCount + ' (' + Math.round(data.qualifiedRate * 100) + '%)' },
    { label: 'Needs review', value: data.needsReviewCount },
    { label: 'Declined', value: data.declinedCount },
    { label: 'Consultations booked', value: data.bookedCount },
    { label: 'Est. pipeline value', value: inr(data.pipelineValueInr) },
  ];
  const html = items.map((it) =>
    '<span class="ticker-item">' + escapeHtml(it.label) + ': <span class="num">' + escapeHtml(String(it.value)) + '</span></span>' +
    '<span class="dot-sep"></span>'
  ).join('');
  // duplicate for a seamless loop (track scrolls exactly -50%)
  document.getElementById('ticker-track').innerHTML = html + html;
}

function render(data) {
  document.getElementById('generated-at').textContent =
    'Updated ' + new Date(data.generatedAt).toLocaleString('en-IN', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });

  buildTicker(data);

  const content = document.getElementById('content');

  const maxCount = Math.max(1, ...data.callsPerDay.map((d) => d.count));
  const chartBars = data.callsPerDay.map((d) => {
    const h = Math.round((d.count / maxCount) * 100);
    const label = new Date(d.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    const fullLabel = new Date(d.date).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
    return '<div class="bar-col">' +
      '<div class="bar-tooltip">' + d.count + ' call' + (d.count === 1 ? '' : 's') + ' · ' + fullLabel + '</div>' +
      '<div class="bar-wrap">' +
        '<div class="bar' + (d.count === 0 ? ' zero' : '') + '" style="height:' + Math.max(h, 2) + '%"></div>' +
      '</div>' +
      '<div class="bar-label">' + label + '</div>' +
    '</div>';
  }).join('');

  const rows = data.recentCalls.length
    ? data.recentCalls.map((c) => {
        const time = c.created_at ? new Date(c.created_at).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
        const booking = c.consultation_booked
          ? (c.consultation_datetime ? new Date(c.consultation_datetime).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : 'Booked')
          : '—';
        const sm = statusMeta(c.qualified_status);
        return '<tr>' +
          '<td>' + time + '</td>' +
          '<td>' + escapeHtml(c.caller_name || 'Unknown') + '</td>' +
          '<td>' + escapeHtml(c.project_type || '—') + '</td>' +
          '<td>' + escapeHtml(c.location || '—') + '</td>' +
          '<td><span class="status-pill ' + sm.cls + '"><span class="dot"></span>' + escapeHtml(c.qualified_status || 'Unknown') + '</span></td>' +
          '<td>' + booking + '</td>' +
        '</tr>';
      }).join('')
    : '<tr><td colspan="6" class="empty">No calls logged yet — they will appear here as the voice agent takes calls.</td></tr>';

  const breakdownTotal = Math.max(1, data.qualifiedCount + data.needsReviewCount + data.declinedCount);
  const breakdown = [
    { label: 'Qualified', count: data.qualifiedCount, color: 'var(--good)' },
    { label: 'Needs Review', count: data.needsReviewCount, color: 'var(--warning)' },
    { label: 'Declined', count: data.declinedCount, color: 'var(--critical)' },
  ].map((row, i) => {
    const pct = Math.round((row.count / breakdownTotal) * 100);
    return '<div class="breakdown-row">' +
      '<div class="breakdown-idx">0' + (i + 1) + '</div>' +
      '<div class="breakdown-label">' + row.label + '</div>' +
      '<div class="breakdown-track"><div class="breakdown-fill" data-pct="' + pct + '" style="background:' + row.color + '"></div></div>' +
      '<div class="breakdown-count">' + row.count + '</div>' +
    '</div>';
  }).join('');

  const statDefs = [
    { key: 'totalCalls', label: 'Total enquiries', accent: 'var(--series-1)', sub: 'all-time, this agent', currency: false },
    { key: 'qualifiedCount', label: 'Qualified leads', accent: 'var(--good)', sub: Math.round(data.qualifiedRate * 100) + '% of calls', currency: false },
    { key: 'bookedCount', label: 'Consultations booked', accent: 'var(--series-1)', sub: 'on Google Calendar', currency: false },
    { key: 'pipelineValueInr', label: 'Est. pipeline value', accent: 'var(--good)', sub: 'qualified × ' + inr(data.avgProjectValueInr) + ' avg', currency: true },
  ];

  content.innerHTML =
    '<div class="stat-row">' +
      statDefs.map((t, i) =>
        '<div class="stat-item" style="--stat-accent: ' + t.accent + '">' +
          '<div class="stat-index">0' + (i + 1) + '</div>' +
          '<div><div class="stat-label">' + t.label + '</div><div class="stat-sub">' + t.sub + '</div></div>' +
          '<div class="stat-value" data-key="' + t.key + '" data-currency="' + t.currency + '">0</div>' +
        '</div>'
      ).join('') +
    '</div>' +
    '<div class="grid-2">' +
      '<div class="card">' +
        '<div class="section-head"><span class="idx">01</span><h2>Calls per day</h2></div>' +
        '<div class="card-sub">Last 14 days</div>' +
        '<div class="chart">' + chartBars + '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="section-head"><span class="idx">02</span><h2>Qualification breakdown</h2></div>' +
        '<div class="card-sub">All-time</div>' +
        '<div class="breakdown">' + breakdown + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="section-head"><span class="idx">03</span><h2>Recent calls</h2></div>' +
      '<div class="card-sub">Most recent 10</div>' +
      '<div class="table-scroll">' +
        '<table><thead><tr><th>Time</th><th>Caller</th><th>Project</th><th>Location</th><th>Status</th><th>Consultation</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="note">' +
        '<svg class="icon" width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.3"/><path d="M8 7v4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="4.6" r="0.9" fill="currentColor"/></svg>' +
        '<span><strong style="color:var(--text-secondary)">Reading this:</strong> Data is logged directly by the voice agent at the end of each call (via Supabase), independent of Vaani’s call-history API. ' +
        'Pipeline value multiplies qualified leads by Case 03’s average project value (₹8–14L midpoint).</span>' +
      '</div>' +
    '</div>';

  // Micro-interactions: count-up stat numbers, then animate breakdown bars in.
  content.querySelectorAll('.stat-value').forEach((el) => {
    const target = data[el.getAttribute('data-key')];
    const isCurrency = el.getAttribute('data-currency') === 'true';
    animateValue(el, 0, target, isCurrency);
  });
  requestAnimationFrame(() => {
    content.querySelectorAll('.breakdown-fill').forEach((el) => {
      el.style.width = el.getAttribute('data-pct') + '%';
    });
  });
}

load(false);
setInterval(() => load(true), REFRESH_MS);
</script>
</body>
</html>
