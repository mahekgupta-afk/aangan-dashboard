<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aangan Studio — Enquiry Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --surface-raised: #ffffff;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --gridline: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --border-strong: rgba(11,11,11,0.16);
    --series-1: #2a78d6;
    --series-1-soft: #cde2fb;
    --good: #0ca30c;
    --good-soft: #e3f6e3;
    --warning: #c98500;
    --warning-soft: #fdf1da;
    --critical: #d03b3b;
    --critical-soft: #fbe6e6;
    --shadow: 0 1px 2px rgba(11,11,11,0.04), 0 4px 16px rgba(11,11,11,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --surface-raised: #212120;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --gridline: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.14);
      --series-1: #3987e5;
      --series-1-soft: #17314f;
      --good: #0ca30c;
      --good-soft: #10281a;
      --warning: #fab219;
      --warning-soft: #332813;
      --critical: #e66767;
      --critical-soft: #3a1a1a;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.25);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 72px; }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, var(--series-1), #1c5cab);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 16px; flex-shrink: 0;
    box-shadow: var(--shadow);
  }
  h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  .subtitle { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }
  .meta-col { text-align: right; }
  .meta { color: var(--text-muted); font-size: 12px; }
  .live-dot {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--good); font-weight: 500;
  }
  .live-dot .pulse {
    width: 6px; height: 6px; border-radius: 50%; background: var(--good);
    box-shadow: 0 0 0 0 rgba(12,163,12,0.5);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(12,163,12,0.45); }
    70% { box-shadow: 0 0 0 6px rgba(12,163,12,0); }
    100% { box-shadow: 0 0 0 0 rgba(12,163,12,0); }
  }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .tile::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--tile-accent, var(--series-1));
  }
  .tile .label { color: var(--text-secondary); font-size: 12.5px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .tile .value { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: proportional-nums; line-height: 1; }
  .tile .sub { color: var(--text-muted); font-size: 12px; margin-top: 8px; }

  .grid-2 {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 760px) {
    .grid-2 { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card h2 { font-size: 14px; margin: 0 0 4px; color: var(--text-primary); font-weight: 600; }
  .card .card-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }

  /* Bar chart */
  .chart { display: flex; align-items: flex-end; gap: 5px; height: 150px; position: relative; }
  .chart::before {
    content: ''; position: absolute; left: 0; right: 0; bottom: 24px;
    border-bottom: 1px solid var(--gridline);
  }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
  .bar-wrap { position: relative; width: 100%; display: flex; justify-content: center; height: 100%; align-items: flex-end; }
  .bar {
    width: 100%; max-width: 26px; background: var(--series-1);
    border-radius: 4px 4px 0 0; min-height: 2px;
    transition: opacity 0.15s, transform 0.15s;
    cursor: default;
  }
  .bar:hover { opacity: 0.8; transform: scaleY(1.01); }
  .bar.zero { background: var(--gridline); }
  .bar-label { color: var(--text-muted); font-size: 10px; margin-top: 6px; white-space: nowrap; }
  .bar-tooltip {
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: var(--text-primary); color: var(--page);
    font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 5px;
    white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.1s;
    z-index: 2;
  }
  .bar-col:hover .bar-tooltip { opacity: 1; }

  /* Status breakdown */
  .breakdown { display: flex; flex-direction: column; gap: 14px; }
  .breakdown-row { display: flex; align-items: center; gap: 10px; }
  .breakdown-label { font-size: 12.5px; color: var(--text-secondary); width: 92px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
  .breakdown-track { flex: 1; height: 8px; border-radius: 4px; background: var(--gridline); overflow: hidden; }
  .breakdown-fill { height: 100%; border-radius: 4px; transition: width 0.3s ease; }
  .breakdown-count { font-size: 13px; font-weight: 600; width: 24px; text-align: right; flex-shrink: 0; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--text-muted); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; padding: 0 10px 10px; border-bottom: 1px solid var(--gridline); }
  td { padding: 11px 10px; border-bottom: 1px solid var(--gridline); color: var(--text-primary); font-variant-numeric: tabular-nums; }
  tbody tr { transition: background 0.1s; }
  tbody tr:hover { background: var(--border); }
  tr:last-child td { border-bottom: none; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500;
    padding: 3px 9px 3px 7px; border-radius: 100px;
  }
  .status-pill.good { background: var(--good-soft); color: var(--good); }
  .status-pill.warning { background: var(--warning-soft); color: var(--warning); }
  .status-pill.critical { background: var(--critical-soft); color: var(--critical); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .table-scroll { overflow-x: auto; }
  table { min-width: 560px; }

  .note {
    color: var(--text-muted); font-size: 12px; line-height: 1.6;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .note .icon { flex-shrink: 0; margin-top: 1px; }
  .empty { color: var(--text-muted); font-size: 13px; padding: 28px 0; text-align: center; }
  .error {
    color: var(--critical); font-size: 13px; background: var(--critical-soft);
    border-radius: 10px; padding: 16px; display: flex; gap: 10px; align-items: flex-start;
  }
  .skeleton {
    background: linear-gradient(90deg, var(--border) 25%, var(--border-strong) 37%, var(--border) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 8px;
  }
  @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  .skeleton-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .skeleton-tile { height: 92px; border-radius: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-mark">A</div>
      <div>
        <h1>Aangan Studio — Phone Enquiry Dashboard</h1>
        <div class="subtitle">aangan-phone-enquiry-agent</div>
      </div>
    </div>
    <div class="meta-col">
      <div class="live-dot"><span class="pulse"></span> Live from Supabase</div>
      <div class="meta" id="generated-at"></div>
    </div>
  </header>

  <div id="content">
    <div class="skeleton-tiles">
      <div class="skeleton skeleton-tile"></div>
      <div class="skeleton skeleton-tile"></div>
      <div class="skeleton skeleton-tile"></div>
      <div class="skeleton skeleton-tile"></div>
    </div>
  </div>
</div>

<script>
const REFRESH_MS = 30000;

async function load(isBackground) {
  const content = document.getElementById('content');
  try {
    const res = await fetch('/api/metrics');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load metrics');
    render(data);
  } catch (err) {
    if (!isBackground) {
      content.innerHTML = '<div class="card"><div class="error">' +
        '<svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.3"/><path d="M8 4.5v4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="11" r="0.8" fill="currentColor"/></svg>' +
        '<span>Could not load dashboard data: ' + escapeHtml(err.message) + '</span>' +
        '</div></div>';
    }
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function inr(n) {
  return '₹' + Math.round(n).toLocaleString('en-IN');
}

function statusMeta(status) {
  if (status === 'Qualified') return { cls: 'good', color: 'var(--good)' };
  if (status === 'Needs Review') return { cls: 'warning', color: 'var(--warning)' };
  if (status === 'Declined') return { cls: 'critical', color: 'var(--critical)' };
  return { cls: 'warning', color: 'var(--warning)' };
}

function render(data) {
  document.getElementById('generated-at').textContent =
    'Updated ' + new Date(data.generatedAt).toLocaleString('en-IN', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });

  const content = document.getElementById('content');

  const maxCount = Math.max(1, ...data.callsPerDay.map((d) => d.count));
  const chartBars = data.callsPerDay.map((d) => {
    const h = Math.round((d.count / maxCount) * 100);
    const label = new Date(d.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    const fullLabel = new Date(d.date).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
    return '<div class="bar-col">' +
      '<div class="bar-tooltip">' + d.count + ' call' + (d.count === 1 ? '' : 's') + ' · ' + fullLabel + '</div>' +
      '<div class="bar-wrap">' +
        '<div class="bar' + (d.count === 0 ? ' zero' : '') + '" style="height:' + Math.max(h, 2) + '%"></div>' +
      '</div>' +
      '<div class="bar-label">' + label + '</div>' +
    '</div>';
  }).join('');

  const rows = data.recentCalls.length
    ? data.recentCalls.map((c) => {
        const time = c.created_at ? new Date(c.created_at).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
        const booking = c.consultation_booked
          ? (c.consultation_datetime ? new Date(c.consultation_datetime).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : 'Booked')
          : '—';
        const sm = statusMeta(c.qualified_status);
        return '<tr>' +
          '<td>' + time + '</td>' +
          '<td>' + escapeHtml(c.caller_name || 'Unknown') + '</td>' +
          '<td>' + escapeHtml(c.project_type || '—') + '</td>' +
          '<td>' + escapeHtml(c.location || '—') + '</td>' +
          '<td><span class="status-pill ' + sm.cls + '"><span class="dot"></span>' + escapeHtml(c.qualified_status || 'Unknown') + '</span></td>' +
          '<td>' + booking + '</td>' +
        '</tr>';
      }).join('')
    : '<tr><td colspan="6" class="empty">No calls logged yet — they will appear here as the voice agent takes calls.</td></tr>';

  const breakdownTotal = Math.max(1, data.qualifiedCount + data.needsReviewCount + data.declinedCount);
  const breakdown = [
    { label: 'Qualified', count: data.qualifiedCount, color: 'var(--good)' },
    { label: 'Needs Review', count: data.needsReviewCount, color: 'var(--warning)' },
    { label: 'Declined', count: data.declinedCount, color: 'var(--critical)' },
  ].map((row) => {
    const pct = Math.round((row.count / breakdownTotal) * 100);
    return '<div class="breakdown-row">' +
      '<div class="breakdown-label">' + row.label + '</div>' +
      '<div class="breakdown-track"><div class="breakdown-fill" style="width:' + pct + '%;background:' + row.color + '"></div></div>' +
      '<div class="breakdown-count">' + row.count + '</div>' +
    '</div>';
  }).join('');

  content.innerHTML =
    '<div class="tiles">' +
      '<div class="tile" style="--tile-accent: var(--series-1)"><div class="label">Total enquiries</div><div class="value">' + data.totalCalls + '</div><div class="sub">all-time, this agent</div></div>' +
      '<div class="tile" style="--tile-accent: var(--good)"><div class="label">Qualified leads</div><div class="value">' + data.qualifiedCount + '</div><div class="sub">' + Math.round(data.qualifiedRate * 100) + '% of calls</div></div>' +
      '<div class="tile" style="--tile-accent: var(--series-1)"><div class="label">Consultations booked</div><div class="value">' + data.bookedCount + '</div><div class="sub">on Google Calendar</div></div>' +
      '<div class="tile" style="--tile-accent: var(--good)"><div class="label">Est. pipeline value</div><div class="value">' + inr(data.pipelineValueInr) + '</div><div class="sub">qualified × ' + inr(data.avgProjectValueInr) + ' avg</div></div>' +
    '</div>' +
    '<div class="grid-2">' +
      '<div class="card">' +
        '<h2>Calls per day</h2>' +
        '<div class="card-sub">Last 14 days</div>' +
        '<div class="chart">' + chartBars + '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h2>Qualification breakdown</h2>' +
        '<div class="card-sub">All-time</div>' +
        '<div class="breakdown">' + breakdown + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<h2>Recent calls</h2>' +
      '<div class="card-sub">Most recent 10</div>' +
      '<div class="table-scroll">' +
        '<table><thead><tr><th>Time</th><th>Caller</th><th>Project</th><th>Location</th><th>Status</th><th>Consultation</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="note">' +
        '<svg class="icon" width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.3"/><path d="M8 7v4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="4.6" r="0.9" fill="currentColor"/></svg>' +
        '<span><strong style="color:var(--text-secondary)">Reading this:</strong> Data is logged directly by the voice agent at the end of each call (via Supabase), independent of Vaani’s call-history API. ' +
        'Pipeline value multiplies qualified leads by Case 03’s average project value (₹8–14L midpoint).</span>' +
      '</div>' +
    '</div>';
}

load(false);
setInterval(() => load(true), REFRESH_MS);
</script>
</body>
</html>
