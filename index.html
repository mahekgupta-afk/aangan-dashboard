<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aangan Studio — Enquiry Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --gridline: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6;
    --series-1-soft: #cde2fb;
    --good: #0ca30c;
    --critical: #d03b3b;
    --warning: #fab219;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --gridline: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --series-1-soft: #184f95;
      --good: #0ca30c;
      --critical: #e66767;
      --warning: #fab219;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 14px; }
  .meta { color: var(--text-muted); font-size: 12px; margin-top: 4px; }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .tile .label { color: var(--text-secondary); font-size: 13px; margin-bottom: 8px; }
  .tile .value { font-size: 28px; font-weight: 600; font-variant-numeric: proportional-nums; }
  .tile .sub { color: var(--text-muted); font-size: 12px; margin-top: 6px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .card h2 { font-size: 15px; margin: 0 0 16px; color: var(--text-primary); }

  .chart { display: flex; align-items: flex-end; gap: 6px; height: 140px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar { width: 100%; max-width: 28px; background: var(--series-1); border-radius: 4px 4px 0 0; min-height: 2px; }
  .bar-label { color: var(--text-muted); font-size: 10px; margin-top: 6px; white-space: nowrap; }
  .bar-wrap { position: relative; width: 100%; display: flex; justify-content: center; height: 100%; align-items: flex-end; }
  .bar-count { position: absolute; top: -16px; font-size: 10px; color: var(--text-secondary); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--text-muted); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--gridline); }
  td { padding: 8px; border-bottom: 1px solid var(--gridline); color: var(--text-primary); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  .status-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.good { background: var(--good); }
  .dot.critical { background: var(--critical); }
  .dot.warning { background: var(--warning); }

  .note { color: var(--text-muted); font-size: 12px; line-height: 1.5; }
  .empty { color: var(--text-muted); font-size: 13px; padding: 20px 0; text-align: center; }
  .error { color: var(--critical); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Aangan Studio — Phone Enquiry Dashboard</h1>
    <div class="subtitle">aangan-phone-enquiry-agent · live from Vaani call history</div>
    <div class="meta" id="generated-at"></div>
  </header>

  <div id="content">
    <div class="empty">Loading…</div>
  </div>
</div>

<script>
async function load() {
  const content = document.getElementById('content');
  try {
    const res = await fetch('/api/metrics');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load metrics');
    render(data);
  } catch (err) {
    content.innerHTML = '<div class="card"><div class="error">Could not load dashboard data: ' + escapeHtml(err.message) + '</div></div>';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function inr(n) {
  return '₹' + Math.round(n).toLocaleString('en-IN');
}

function formatDuration(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  return m + 'm ' + s + 's';
}

function statusDotClass(status) {
  const s = (status || '').toLowerCase();
  if (s.includes('completed') || s.includes('picked')) return 'good';
  if (s.includes('disconnect') || s.includes('missed') || s.includes('fail')) return 'warning';
  return 'warning';
}

function render(data) {
  document.getElementById('generated-at').textContent =
    'Updated ' + new Date(data.generatedAt).toLocaleString('en-IN');

  const content = document.getElementById('content');

  const maxCount = Math.max(1, ...data.callsPerDay.map((d) => d.count));
  const chartBars = data.callsPerDay.map((d) => {
    const h = Math.round((d.count / maxCount) * 100);
    const label = new Date(d.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    return '<div class="bar-col">' +
      '<div class="bar-wrap">' +
        (d.count > 0 ? '<div class="bar-count">' + d.count + '</div>' : '') +
        '<div class="bar" style="height:' + Math.max(h, 2) + '%"></div>' +
      '</div>' +
      '<div class="bar-label">' + label + '</div>' +
    '</div>';
  }).join('');

  const rows = data.recentCalls.length
    ? data.recentCalls.map((c) => {
        const time = c.start_time ? new Date(c.start_time).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
        return '<tr>' +
          '<td>' + time + '</td>' +
          '<td>' + escapeHtml(c.caller_name || 'Unknown') + '</td>' +
          '<td>' + formatDuration(c.duration_sec) + '</td>' +
          '<td>' + inr(c.cost_inr) + '</td>' +
          '<td><span class="status-pill"><span class="dot ' + statusDotClass(c.status) + '"></span>' + escapeHtml(c.status || '—') + '</span></td>' +
        '</tr>';
      }).join('')
    : '<tr><td colspan="5" class="empty">No calls yet</td></tr>';

  content.innerHTML =
    '<div class="tiles">' +
      '<div class="tile"><div class="label">Total enquiries</div><div class="value">' + data.totalCalls + '</div><div class="sub">all-time, this agent</div></div>' +
      '<div class="tile"><div class="label">Engaged calls</div><div class="value">' + data.engagedCount + '</div><div class="sub">' + Math.round(data.engagementRate * 100) + '% of calls, ' + data.engagedThresholdSec + 's+ duration</div></div>' +
      '<div class="tile"><div class="label">Avg. cost per call</div><div class="value">' + inr(data.avgCostInr) + '</div><div class="sub">' + inr(data.totalCostInr) + ' total spend</div></div>' +
      '<div class="tile"><div class="label">Est. pipeline value</div><div class="value">' + inr(data.pipelineValueInr) + '</div><div class="sub">engaged calls × ' + inr(data.avgProjectValueInr) + ' avg project</div></div>' +
    '</div>' +
    '<div class="card">' +
      '<h2>Calls per day (last 14 days)</h2>' +
      '<div class="chart">' + chartBars + '</div>' +
    '</div>' +
    '<div class="card">' +
      '<h2>Recent calls</h2>' +
      '<table><thead><tr><th>Time</th><th>Caller</th><th>Duration</th><th>Cost</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '</div>' +
    '<div class="card">' +
      '<div class="note">' +
        '<strong>Reading this:</strong> "Engaged calls" (' + data.engagedThresholdSec + 's+) is a proxy for a real enquiry, not a confirmed qualified lead — ' +
        'Vaani does not yet tag qualification status per call. Pipeline value multiplies that proxy by Case 03’s average project value (₹8–14L midpoint). ' +
        'For an exact qualified-lead count, configure a Vaani Eval on this agent, or track designer handoff emails sent via Resend.' +
      '</div>' +
    '</div>';
}

load();
</script>
</body>
</html>
